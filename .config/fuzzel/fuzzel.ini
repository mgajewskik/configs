; border=b4befeff

; background=282a36fa
background=1f1f28ff
; background=404552ff
selection=3d4474fa
; border=fffffffa
border=6a9589ff
input=c8c093ff

[border]
radius=20
width=3

[key-bindings]
next=Control+j
prev=Control+k
delete-line-forward=Control+p

