; https://man.archlinux.org/man/fuzzel.ini.5.en#:~:text=fuzzel.ini%20-%20configuration%20file%20for%20fuzzel(1)%20DESCRIPTION.%20fuzzel%20uses%20the
dpi-aware=no
icon-theme=Papirus-Dark
width=80
font=JetBrainsMono:weight=bold:size=13
line-height=16
fields=name,generic,comment,categories,filename,keywords,exec
terminal=ghostty -e
prompt="❯   "
show-actions=yes
exit-on-keyboard-focus-loss=no
layer=overlay
lines=15

[dmenu]
exit-immediately-if-empty=yes

[colors]
; background=1e1e2eaa
; text=cdd6f4ff
text=76946aff
; match=f38ba8ff
