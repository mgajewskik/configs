bind=SUPER,Q,killclient
bind=SUPER+shift,Q,spawn,wlogout -b 4
# bind=SUPER,Return,spawn,ghostty
bind=SUPER,Return,spawn,alacritty
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,c,spawn,vicinae vicinae://extensions/vicinae/clipboard/history
bind=SUPER,w,spawn,pavucontrol
# bind=SUPER,n,spawn,qs -c noctalia-shell ipc call notifications toggleHistory
bind=SUPER+shift,l,spawn,swaylock -i ~/pictures/wallpapers/simple_arch.png -s fill

bind=Alt,Tab,spawn,vicinae toggle
bind=Alt,r,spawn,$HOME/scripts/screen-record.sh
bind=Alt,w,spawn,helium-browser
bind=Alt,e,spawn,nemo ~/downloads
bind=Alt,p,spawn,bitwarden-desktop
# bind=Alt,t,spawn,$HOME/scripts/transcribe.sh
bind=Alt,t,spawn,$HOME/scripts/handy.sh down
bindr=Alt,t,spawn,$HOME/scripts/handy.sh up
# bind=Alt,t,spawn,$HOME/scripts/handy.sh post-down
# bindr=Alt,t,spawn,$HOME/scripts/handy.sh post-up
# bind=Alt,o,spawn,slack --enable-features=UseOzonePlatform --ozone-platform=wayland --enable-features=WaylandWindowDecorations
# bind=Alt,t,spawn,teams-for-linux --enable-features=UseOzonePlatform --ozone-platform=wayland --enable-features=WaylandWindowDecorations
# bind=Alt,n,spawn,dunstctl set-paused toggle
bind=Alt,n,spawn,makoctl mode -t do-not-disturb

# Laptop multimedia keys for volume and LCD brightness
bind = NONE,Print,spawn,$HOME/scripts/screenshot.sh
bind = NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE,XF86AudioLowerVolume,spawn,wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bind = NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = NONE,XF86MonBrightnessUp,spawn,brightnessctl set 10%+
bind = NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-

bind = NONE,XF86Display,spawn,$HOME/scripts/toggle_hypridle.sh

# Requires playerctl
# bind = NONE,XF86AudioNext,spawn,qs -c noctalia-shell ipc call media next
# bind = NONE,XF86AudioPause,spawn,qs -c noctalia-shell ipc call media pause
# bind = NONE,XF86AudioPlay,spawn,qs -c noctalia-shell ipc call media play
# bind = NONE,XF86AudioPrev,spawn,qs -c noctalia-shell ipc call media previous

bind=SUPER+SHIFT,f,togglefloating,
# bind=SUPER,f,togglefullscreen,
bind=SUPER,f,togglemaximizescreen

bind=ALT+SHIFT,s,minimized,

bind=ALT,s,toggle_scratchpad
# use lswt cli to get the window ID
# bind=MODIFIERS,KEY,toggle_named_scratchpad,SCRATCHPAD_NAME,APP_ID,COMMAND
# bind=ALT,s,toggle_named_scratchpad,obsidian,none,obsidian --enable-features=UseOzonePlatform --ozone-platform=wayland
# windowrule=isnamedscratchpad:1,width:2000,height:1400,appid:obsidian

bind=SUPER,s,toggle_named_scratchpad,Todoist,none,todoist --enable-features=UseOzonePlatform --ozone-platform=wayland
windowrule=isnamedscratchpad:1,width:2000,height:1400,appid:Todoist
# bind=ALT,s,toggle_named_scratchpad,notes,notes,ghostty -e tmux attach -t notes
# bind=ALT,s,toggle_named_scratchpad,com.mitchellh.ghostty,none,ghostty -e tmux attach -t notes

bind=SUPER,1,comboview,1
bind=SUPER,2,comboview,2
bind=SUPER,3,comboview,3
bind=SUPER,4,comboview,4

bind=ALT,1,comboview,5
bind=ALT,2,comboview,6
bind=ALT,3,comboview,7
bind=ALT,4,comboview,8
bind=ALT,5,comboview,9

# Move windows to workspace
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4

bind=ALT+SHIFT,1,tag,5
bind=ALT+SHIFT,2,tag,6
bind=ALT+SHIFT,3,tag,7
bind=ALT+SHIFT,4,tag,8
bind=ALT+SHIFT,5,tag,9

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+ctrl,k,exchange_client,up
bind=SUPER+ctrl,j,exchange_client,down
bind=SUPER+ctrl,h,exchange_client,left
bind=SUPER+ctrl,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
# bind=ALT,Tab,toggleoverview,
# bind=SUPER,i,minimized,
# bind=SUPER,o,toggleoverlay,
# bind=SUPER+SHIFT,I,restore_minimized

# switch layout
# bind=SUPER,n,switch_layout
bind=SUPER,t,setlayout,tile
bind=SUPER,e,setlayout,scroller
# bind=SUPER,s,setlayout,scroller
# bind=SUPER,m,setlayout,monocle

# scroller layout
# bind=ALT,e,set_proportion,1.0
bind=SUPER,r,switch_proportion_preset,

# monitor switch
bind=ALT,h,focusmon,left
bind=ALT,l,focusmon,right
bind=ALT,j,focusmon,down
bind=ALT,k,focusmon,up
bind=ALT+ctrl,h,tagmon,left
bind=ALT+ctrl,l,tagmon,right
bind=ALT+ctrl,j,tagmon,down
bind=ALT+ctrl,k,tagmon,up

# # Mouse Button Bindings
# # NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
# mousebind=NONE,btn_left,toggleoverview,1
# mousebind=NONE,btn_right,killclient,0

# mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=SUPER,btn_right,moveresize,curresize

# Mouse Wheel Bindings
# axisbind=SUPER,UP,viewtoleft_have_client
# axisbind=SUPER,DOWN,viewtoright_have_client

# Gesturebind
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Binds for lid fold toggle
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
switchbind=fold,spawn,wlr-dpms off eDP-1
switchbind=unfold,spawn,wlr-dpms on

# window rules
windowrule=title:Authentication required,isfloating:1
windowrule=title:Keybindings,isfloating:1
windowrule=title:Rename*,isfloating:1
windowrule=title:Compressing*,isfloating:1
windowrule=title:File Already Exists*,isfloating:1
windowrule=title:Extracting Files*,isfloating:1
windowrule=title:File Operation Progress*,isfloating:1
windowrule=title:Confirm to replace files*,isfloating:1
windowrule=title:Mission Center,isfloating:1,width:1400,height:800

windowrule=appid:pavucontrol,isfloating:1
windowrule=appid:clipse,isfloating:1,width:600,height:800
windowrule=appid:hyprland-share-picker,isfloating:1
windowrule=appid:udiskie,isfloating:1
windowrule=appid:blueman-manager,isfloating:1

################################################################### copied from this step

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 0-horizontal,1-vertical
animations=0
layer_animations=1
animation_type_open=fade
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=300
animation_duration_open=200
animation_duration_tag=150
animation_duration_close=300
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=1
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.5
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
exchange_cross_monitor=1
scratchpad_cross_monitor=0
# Controls whether focus keybinds can jump between windows on different tags (even if not currently viewed).
focus_cross_tag=1
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_theme=phinger-cursors-light
drag_tile_to_tile=1

# keyboard
repeat_rate=80
repeat_delay=200
numlockon=0
xkb_rules_layout=pl
xkb_rules_options=ctrl:nocaps

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
accel_speed=0.7

# Appearance
gappih=0
gappiv=0
gappoh=0
gappov=0
scratchpad_width_ratio=0.7
scratchpad_height_ratio=0.95
borderpx=1
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
