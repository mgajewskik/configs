# Version 2.8.3
# DO NOT REMOVE THE REPLACEMENT COMMENTS
# REQUIRED BY THE ML4W SETTINGS APP
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = qs -c noctalia-shell ipc call lockScreen lock
    before_sleep_cmd = qs -c noctalia-shell ipc call lockScreen lock
    after_sleep_cmd = wlr-dpms on
}

listener {
    timeout = 300
    on-timeout = qs -c noctalia-shell ipc call lockScreen lock
}

# dpms
# https://wiki.archlinux.org/title/Display_Power_Management_Signaling
listener {
    # DPMS TIMEOUT
    timeout = 360
    # DPMS ONTIMEOUT
    on-timeout = wlr-dpms off
    # DPMS ONRESUME
    on-resume = wlr-dpms on
}

# # Suspend
listener {
    # SUSPEND TIMEOUT
    timeout = 1800
    #SUSPEND ONTIMEOUT
    on-timeout = systemctl suspend
}
