# bind = XF86Display, exec, ~/scripts/toggle_screensaver.sh
# XF86WLAN
# XF86Messenger
# XF86Go
# Cancel
# XF86Favorites

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$secondaryMod = ALT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, R, exec, hyprctl reload
# bind = $mainMod, M, exit,
bind = $mainMod, Tab, cyclenext,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, togglefloating,
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, w, exec, pavucontrol
bind = $mainMod, C, exec, rofi -modi "clipboard:greenclip print" -show clipboard -run-command '{cmd}'

bind = $secondaryMod, Tab, exec, rofi -show combi -run-shell-command 'alacritty --hold -e zsh -ic "{cmd} && read"'
bind = $secondaryMod, W, exec, brave
bind = $secondaryMod, E, exec, nemo ~/downloads
bind = $secondaryMod, P, exec, bitwarden-desktop
bind = $secondaryMod, F, exec, ferdium
bind = $secondaryMod, B, exec, killall waybar; waybar &

# Move focus and windows with mainMod + hjkl
bind = $mainMod, h, movefocus, l
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod, l, movefocus, r
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod, k, movefocus, u
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod, j, movefocus, d
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
# bind = $mainMod, 1, workspace, 1
# bind = $mainMod, 2, workspace, 2
# bind = $mainMod, 3, workspace, 3
# bind = $mainMod, 4, workspace, 4
# bind = $mainMod, 5, workspace, 5
# bind = $mainMod, 6, workspace, 6
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mainMod, 0, focusworkspaceoncurrentmonitor, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Switch workspaces with mainMod + [0-9]
# bind = $secondaryMod, 1, workspace, 11
# bind = $secondaryMod, 2, workspace, 12
# bind = $secondaryMod, 3, workspace, 13
# bind = $secondaryMod, 4, workspace, 14
# bind = $secondaryMod, 5, workspace, 15
# bind = $secondaryMod, 6, workspace, 16
# bind = $secondaryMod, 7, workspace, 17
# bind = $secondaryMod, 8, workspace, 18
# bind = $secondaryMod, 9, workspace, 19
# bind = $secondaryMod, 0, workspace, 20

bind = $secondaryMod, 1, focusworkspaceoncurrentmonitor, 11
bind = $secondaryMod, 2, focusworkspaceoncurrentmonitor, 12
bind = $secondaryMod, 3, focusworkspaceoncurrentmonitor, 13
bind = $secondaryMod, 4, focusworkspaceoncurrentmonitor, 14
bind = $secondaryMod, 5, focusworkspaceoncurrentmonitor, 15
bind = $secondaryMod, 6, focusworkspaceoncurrentmonitor, 16
bind = $secondaryMod, 7, focusworkspaceoncurrentmonitor, 17
bind = $secondaryMod, 8, focusworkspaceoncurrentmonitor, 18
bind = $secondaryMod, 9, focusworkspaceoncurrentmonitor, 19
bind = $secondaryMod, 0, focusworkspaceoncurrentmonitor, 20

# Move asecondarye window to a workspace with mainMod + SHIFT + [0-9]
bind = $secondaryMod SHIFT, 1, movetoworkspace, 11
bind = $secondaryMod SHIFT, 2, movetoworkspace, 12
bind = $secondaryMod SHIFT, 3, movetoworkspace, 13
bind = $secondaryMod SHIFT, 4, movetoworkspace, 14
bind = $secondaryMod SHIFT, 5, movetoworkspace, 15
bind = $secondaryMod SHIFT, 6, movetoworkspace, 16
bind = $secondaryMod SHIFT, 7, movetoworkspace, 17
bind = $secondaryMod SHIFT, 8, movetoworkspace, 18
bind = $secondaryMod SHIFT, 9, movetoworkspace, 19
bind = $secondaryMod SHIFT, 0, movetoworkspace, 20

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, main
bind = $mainMod SHIFT, S, movetoworkspace, special:main
bind = $secondaryMod, S, togglespecialworkspace, secondary
bind = $secondaryMod SHIFT, S, movetoworkspace, special:secondary

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Submaps

bind = $mainMod, B, submap, blugon
submap = blugon
bind = $mainMod, U, exec, blugon
bind = $mainMod, D, exec, blugon
bind = $mainMod, R, exec, blugon
bind=,escape,submap,reset
submap = reset
