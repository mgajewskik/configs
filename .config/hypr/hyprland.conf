# See https://wiki.hyprland.org/Configuring/Monitors/
# https://github.com/mylinuxforwork/dotfiles/tree/main/share/dotfiles/.config/hypr/conf
# hyprctl monitors all
# monitor = eDP-1,1920x1200@60.00100,0x0,1
monitor = DP-2,3840x1600@59.99400,0x0,1

# Dell U3415H
monitor = eDP-1,1920x1200@60.00100,3840x0,1
monitor = HDMI-A-1,3840x1600@59.99400,0x0,1

# Sony TV via HDMI
# monitor = eDP-1,1920x1200@60.00100,1920x0,1
# monitor = HDMI-A-1,1920x1080@60.00000,0x0,1

monitor=,preferred,auto,auto

# Some default env vars.
env = XDG_CURRENT_DESKTOP,Hyprland
# env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# env = QT_QPA_PLATFORM,wayland;xcb
# env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

# env = GDK_SCALE,1
# env = GDK_BACKEND,"wayland"  # ghostty can't turn on with this, wlogout also does not work, waybar doesn not recognize wayland
# env = GTK_THEME,Arc-Dark
# env = XCURSOR_THEME,phinger-cursors-light
# env = XCURSOR_SIZE,20
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprcursor/
# env = HYPRCURSOR_THEME,phinger-cursors-light
# env = HYPRCURSOR_SIZE,20

# https://github.com/bugaevc/wl-clipboard/issues/114#issuecomment-813418627
env = APPIMAGELAUNCHER_DISABLE,1
env = OZONE_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland

# Execute your favorite apps at launch
# exec-once = waybar
exec-once = qs -c noctalia-shell
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = udiskie --tray
exec-once = nm-applet
exec-once = blueman-applet
# exec-once = dropbox
exec-once = fusuma
exec-once = wl-paste --watch cliphist store
# exec-once = $HOME/scripts/import_env tmux  # does not seem to work, better to use hyprctl --instance 0 alias

exec = killall waybar && waybar &
exec = insync quit && insync start
# exec = systemctl --user restart greenclip.service
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprsunset/
exec = hyprsunset -t 5000
exec = hyprctl setcursor phinger-cursors-light 20

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gaps_in = 1
    gaps_out = 1
    border_size = 3
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    #5294e2
    # col.active_border = rgba(5294e2ee)
    # col.active_border = rgba(82, 148, 226, 1)
    # col.active_border = rgb(82, 148, 226)
    col.inactive_border = rgba(595959aa)

    layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    resize_on_border = true
}

animations {
    enabled = false

    # mlfw
    # bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    # animation = windows, 1, 3, myBezier
    # animation = windowsOut, 1, 3, default, popin 80%
    # animation = border, 1, 10, default
    # animation = borderangle, 1, 8, default
    # animation = fade, 1, 7, default
    # animation = workspaces, 1, 3, default

    # end-4
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1 # use with .2s duration
    # Animation configs
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    # animation = layers, 1, 2, md3_decel, slide
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 0.5, menu_accel
    animation = workspaces, 1, 7, menu_decel, slide
    # animation = workspaces, 1, 2.5, softAcDecel, slide
    # animation = workspaces, 1, 7, menu_decel, slidefade 15%
    # animation = specialWorkspace, 1, 3, md3_decel, slidefadevert 15%
    # animation = specialWorkspace, 1, 3, md3_decel, slidevert
    animation = specialWorkspace, 1, 3, md3_decel, slidefadevert 15%
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 2

    blur {
        enabled = true

        xray = true
        special = false
        new_optimizations = true
        size = 14
        passes = 4
        brightness = 1
        noise = 0.01
        contrast = 1
        popups = true
        popups_ignorealpha = 0.6
        # vibrancy = 0.1696
    }

    shadow {
        enabled = true

        ignore_window = true
        range = 20
        offset = 0 2
        render_power = 3
        # color = rgba(1a1a1aee)
        color = rgba(0000002A)
    }

    # drop_shadow = false
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)

    dim_inactive = false
    dim_strength = 0.1
    dim_special = 0
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
    force_split = 2
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    #
    # vfr = true
    # disable_hyprland_logo = true
    # # disable_splash_rendering = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    vfr = 1
    vrr = 1
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty|Ghostty|ghostty)
    
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    
    initial_workspace_tracking = false
}

input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0.7 # -1.0 - 1.0, 0 means no modification.

    repeat_rate = 80
    repeat_delay = 200

    special_fallthrough = false
}

device {
    # See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
    # get with hyprctl devices
    name = tpps/2-elan-trackpoint
    natural_scroll = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # TODO: this does not exist in the new Hyprland 0.51.0
    # workspace_swipe = true
    # workspace_swipe_fingers = 4

    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

workspace = special:main,gapsout:40
workspace = special:secondary,gapsout:40

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# windowrulev2 = size 60% 50%, class:^(pavucontrol)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
windowrulev2 = idleinhibit fullscreen, class:.*

windowrulev2 = float,class:(clipse) # ensure you have a floating window class set if you want this behavior
windowrulev2 = size 622 652,class:(clipse) # set the size of the window as necessary
# bind = SUPER, C, exec, alacritty --class clipse -e 'clipse'

windowrulev2 = float,class:(backslash) # ensure you have a floating window class set if you want this behavior
windowrulev2 = size 622 652,class:(backslash) # set the size of the window as necessary
bind = SUPER, d, exec, backslash --class backslash -e 'backslash'

windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$, title:^(Volume Control)$
windowrulev2 = center,class:^(org.pulseaudio.pavucontrol)$, title:^(Volume Control)$

windowrulev2 = float,class:^(blueman-manager)$, title:^(Bluetooth Devices)$
windowrulev2 = center,class:^(blueman-manager)$, title:^(Bluetooth Devices)$

windowrulev2 = float, class:^(flameshot)$, title:^(Save screenshot)$
windowrulev2 = center, class:^(flameshot)$, title:^(Save screenshot)$

windowrulev2 = float, class:^(udiskie)$, title:^(udiskie)$
windowrulev2 = center, class:^(udiskie)$, title:^(udiskie)$

windowrulev2 = float, class:^(nemo)$, title:^(\bProperties\b|.*\bProperties\b.*)$
windowrulev2 = center, class:^(nemo)$, title:^(\bProperties\b|.*\bProperties\b.*)$

windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 60% 80%, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$

# Rules for XWaylandVideoBridge
# https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$
windowrulev2 = nofocus, class:^(xwaylandvideobridge)$

# https://github.com/end-4/dots-hyprland/blob/main/.config/hypr/hyprland/rules.conf
# windowrule = noblur,.*  # disabled in the newest update
windowrulev2 = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = center, title:^(Open File)(.*)$
windowrule = center, title:^(Select a File)(.*)$
windowrule = center, title:^(Choose wallpaper)(.*)$
windowrule = center, title:^(Open Folder)(.*)$
windowrule = center, title:^(Save As)(.*)$
windowrule = center, title:^(Library)(.*)$
windowrule = center, title:^(File Upload)(.*)$

# Picture-in-Picture
windowrulev2 = keepaspectratio, title:^(Picture(-| )in(-| )[Pp]icture)$
windowrulev2 = move 73% 72%,title:^(Picture(-| )in(-| )[Pp]icture)$ 
windowrulev2 = size 25%, title:^(Picture(-| )in(-| )[Pp]icture)$
windowrulev2 = float, title:^(Picture(-| )in(-| )[Pp]icture)$
windowrulev2 = pin, title:^(Picture(-| )in(-| )[Pp]icture)$

# Dialogs
windowrule=float,title:^(Open File)(.*)$
windowrule=float,title:^(Select a File)(.*)$
windowrule=float,title:^(Choose wallpaper)(.*)$
windowrule=float,title:^(Open Folder)(.*)$
windowrule=float,title:^(Save As)(.*)$
windowrule=float,title:^(Library)(.*)$
windowrule=float,title:^(File Upload)(.*)$

source = ~/.config/hypr/keymaps.conf
